<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Unlock Notification</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333; max-width: 600px; margin: 0 auto; padding: 20px;">
    <div style="background-color: #f4f4f4; padding: 20px; border-radius: 5px; margin-bottom: 20px;">
        <h2 style="color: #E95420; margin-top: 0;">🔓 Website Unlock Notification</h2>
    </div>
    
    <div style="background-color: #ffffff; padding: 20px; border: 1px solid #ddd; border-radius: 5px;">
        <p style="margin: 0 0 15px 0;"><strong>Someone has unlocked your website!</strong></p>
        
        <table style="width: 100%; border-collapse: collapse;">
            <tr>
                <td style="padding: 8px 0; border-bottom: 1px solid #eee; font-weight: bold; width: 150px;">Name:</td>
                <td style="padding: 8px 0; border-bottom: 1px solid #eee;">{{name}}</td>
            </tr>
            <tr>
                <td style="padding: 8px 0; border-bottom: 1px solid #eee; font-weight: bold;">Time:</td>
                <td style="padding: 8px 0; border-bottom: 1px solid #eee;">{{timestamp}}</td>
            </tr>
            <tr>
                <td style="padding: 8px 0; border-bottom: 1px solid #eee; font-weight: bold;">Location:</td>
                <td style="padding: 8px 0; border-bottom: 1px solid #eee;">{{location}}</td>
            </tr>
            <tr>
                <td style="padding: 8px 0; border-bottom: 1px solid #eee; font-weight: bold;">Timezone:</td>
                <td style="padding: 8px 0; border-bottom: 1px solid #eee;">{{timezone}}</td>
            </tr>
            <tr>
                <td style="padding: 8px 0; border-bottom: 1px solid #eee; font-weight: bold;">Screen Resolution:</td>
                <td style="padding: 8px 0; border-bottom: 1px solid #eee;">{{screen_resolution}}</td>
            </tr>
            <tr>
                <td style="padding: 8px 0; border-bottom: 1px solid #eee; font-weight: bold;">Referrer:</td>
                <td style="padding: 8px 0; border-bottom: 1px solid #eee;">{{referrer}}</td>
            </tr>
            <tr>
                <td style="padding: 8px 0; font-weight: bold; vertical-align: top;">User Agent:</td>
                <td style="padding: 8px 0; word-break: break-word;">{{user_agent}}</td>
            </tr>
        </table>
    </div>
    
    <div style="margin-top: 20px; padding: 15px; background-color: #f9f9f9; border-radius: 5px; font-size: 12px; color: #666;">
        <p style="margin: 0;">This is an automated notification from your website.</p>
    </div>
</body>
</html>
